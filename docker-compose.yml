services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    command: ["serve"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  ollama-model-init:
    image: ollama/ollama:latest
    container_name: rag-ollama-model-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Ollama..."
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        echo "Pulling qwen3-vl:2b-instruct..."
        ollama pull qwen3-vl:2b-instruct
        echo "Model ready."
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL_NAME: qwen3-vl:2b-instruct
      OLLAMA_TIMEOUT: "600"
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  ollama_data:
